services:
  mysql:
    image: mysql:8.0
    container_name: dev-stack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: default_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - dev-stack-network
    command: --default-authentication-plugin=mysql_native_password --sql-mode=""

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: dev-stack-phpmyadmin
    restart: unless-stopped
    ports:
      - "7901:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    networks:
      - dev-stack-network
    depends_on:
      - mysql

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.7
    container_name: dev-stack-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:7903
      - http.cors.allow-headers=X-Requested-With,Content-Type,Content-Length,Authorization
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - dev-stack-network

  elasticvue:
    image: cars10/elasticvue:latest
    container_name: dev-stack-elasticvue
    restart: unless-stopped
    ports:
      - "7903:8080"
    environment:
      - 'ELASTICVUE_CLUSTERS=[{"name":"dev-stack","uri":"http://localhost:9200"}]'
    networks:
      - dev-stack-network
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.7
    container_name: dev-stack-kibana
    # Opt-in (~650MB RAM): starts only with `docker compose --profile apm up -d`
    profiles: ["apm"]
    restart: unless-stopped
    ports:
      - "7905:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Dev-only key (min 32 chars); enables Kibana alerting/rules used by the APM UI
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=dev-stack-encryption-key-change-me-0123456789
    networks:
      - dev-stack-network
    depends_on:
      - elasticsearch

  apm-server:
    image: docker.elastic.co/apm/apm-server:9.5.7
    container_name: dev-stack-apm-server
    # Opt-in: starts only with `docker compose --profile apm up -d`
    profiles: ["apm"]
    restart: unless-stopped
    ports:
      - "8200:8200"
    command:
      - --strict.perms=false
      - -e
      - -E
      - apm-server.host=0.0.0.0:8200
      - -E
      - apm-server.rum.enabled=true
      - -E
      - apm-server.kibana.enabled=true
      - -E
      - apm-server.kibana.host=http://kibana:5601
      - -E
      - output.elasticsearch.hosts=["http://elasticsearch:9200"]
    networks:
      - dev-stack-network
    depends_on:
      - elasticsearch
      - kibana

  memcached:
    image: memcached:1.6-alpine
    container_name: dev-stack-memcached
    restart: unless-stopped
    ports:
      - "11211:11211"
    command: memcached -m 256
    networks:
      - dev-stack-network

  phpcacheadmin:
    image: robinn/phpcacheadmin:latest
    container_name: dev-stack-phpcacheadmin
    restart: unless-stopped
    ports:
      - "7902:80"
    environment:
      - PCA_MEMCACHED_0_NAME=Memcached
      - PCA_MEMCACHED_0_HOST=memcached
      - PCA_MEMCACHED_0_PORT=11211
    networks:
      - dev-stack-network
    depends_on:
      - memcached

  redis:
    image: redis:7-alpine
    container_name: dev-stack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dev-stack-network
    command: redis-server --appendonly yes

  redisinsight:
    image: redis/redisinsight:latest
    container_name: dev-stack-redisinsight
    restart: unless-stopped
    ports:
      - "7904:5540"
    volumes:
      - redisinsight:/data
    networks:
      - dev-stack-network

volumes:
  mysql_data:
    driver: local
  elasticsearch_data:
    driver: local
  redis_data:
    driver: local
  redisinsight:
    driver: local

networks:
  dev-stack-network:
    driver: bridge
